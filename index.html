
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">

  <title>Çarpma</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #000000;
      color: #ffffff;

      font-family: -apple-system, BlinkMacSystemFont,
                   "SF Pro Display", Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding: max(65px, env(safe-area-inset-top))
               18px
               30px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* SAYI GİRİŞ ALANLARI */

    .inputs {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 24px;
    }

    .inputs input {
      width: 0;
      flex: 1;
      height: 88px;

      background: #fffca0;
      color: #000000;

      border: 4px solid white;
      border-radius: 12px;

      font-size: 44px;
      font-weight: 800;
      text-align: center;

      outline: none;
      padding: 4px;

      box-shadow: 0 2px 8px rgba(255,255,255,0.10);
    }

    .inputs input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.3);
    }

    .inputs input::placeholder {
      color: #888650;
    }

    input::-webkit-inner-spin-button,
    input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    /* KIRMIZI ÜÇGEN BUTON */

    .triangle {
      width: min(70vw, 300px);
      aspect-ratio: 1.15 / 1;

      margin-top: 65px;

      background: linear-gradient(
        160deg,
        #ff4242 0%,
        #fa1010 50%,
        #d90000 100%
      );

      border: none;
      color: white;

      clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
      );

      display: flex;
      justify-content: center;
      align-items: flex-end;

      padding-bottom: 28px;

      font-size: 36px;
      font-weight: 900;

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;

      filter: drop-shadow(0 0 14px rgba(255,0,0,0.4));

      transition: transform 0.1s ease;
    }

    .triangle:active {
      transform: scale(0.94);
    }

    /* SONUÇ */

    #sonuc {
      margin-top: 65px;

      font-size: clamp(60px, 19vw, 100px);
      font-weight: 800;

      color: #ffffff;
      text-align: center;

      max-width: 100%;
      overflow-wrap: anywhere;
      line-height: 1.2;
    }

    #durum {
      margin-top: 15px;
      min-height: 24px;

      text-align: center;
      font-size: 15px;
      color: #aaaaaa;
    }

    /* KÜÇÜK EKRANLAR */

    @media (max-width: 380px) {
      .inputs {
        gap: 20px;
      }

      .inputs input {
        height: 72px;
        font-size: 36px;
      }

      .triangle {
        margin-top: 55px;
        font-size: 30px;
      }

      #sonuc {
        margin-top: 50px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="inputs">

      <input
        id="sayi1"
        type="number"
        inputmode="decimal"
        placeholder="1"
        aria-label="Birinci sayı">

      <input
        id="sayi2"
        type="number"
        inputmode="decimal"
        placeholder="2"
        aria-label="İkinci sayı">

    </div>

    <button
      class="triangle"
      onclick="hesapla()"
      aria-label="Çarp">
      ÇARP
    </button>

    <div id="sonuc">—</div>

    <div id="durum"></div>

  </div>


<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxRo0pdcBzjlfCwX_WtJiqZFHJI-dmH0jNjXxGfymtyS-Kq7SPMVHLuJZqpOWjY-yN-mg/exec";

let cevapGeldi = false;
let istekNo = 0;
let zamanAsimi = null;

const sayi1 = document.getElementById("sayi1");
const sayi2 = document.getElementById("sayi2");
const sonuc = document.getElementById("sonuc");
const durum = document.getElementById("durum");

function hesapla() {

  const a = sayi1.value;
  const b = sayi2.value;

  if (a.trim() === "" || b.trim() === "") {
    durum.innerText = "Lütfen iki sayı girin.";
    return;
  }

  // Eski isteği geçersiz kıl.
  const buIstek = ++istekNo;
  cevapGeldi = false;

  clearTimeout(zamanAsimi);

  sonuc.innerText = "—";
  durum.innerText = "Hesaplanıyor...";

  // Telefon klavyesini kapat.
  document.activeElement.blur();

  const eskiScript =
    document.getElementById("jsonpScript");

  if (eskiScript) {
    eskiScript.remove();
  }

  const script = document.createElement("script");
  script.id = "jsonpScript";

  // Her isteğe özel callback kullan.
  const callbackAdi = "carpmaCallback_" + buIstek;

  window[callbackAdi] = function(data) {

    if (buIstek !== istekNo) return;

    cevapGeldi = true;
    clearTimeout(zamanAsimi);

    if (data && data.success) {
      sonuc.innerText = data.result;
      durum.innerText = "";
    } else {
      durum.innerText = "Hata oluştu.";
    }

  };

  script.src =
    APPS_SCRIPT_URL +
    "?a=" + encodeURIComponent(a) +
    "&b=" + encodeURIComponent(b) +
    "&callback=" + callbackAdi +
    "&t=" + Date.now();

  script.onerror = function() {

    if (buIstek !== istekNo || cevapGeldi) return;

    cevapGeldi = true;
    clearTimeout(zamanAsimi);

    durum.innerText =
      "Apps Script bağlantı hatası.";
  };

  document.body.appendChild(script);

  zamanAsimi = setTimeout(function() {

    if (buIstek === istekNo && !cevapGeldi) {

      cevapGeldi = true;

      durum.innerText =
        "Apps Script'ten cevap alınamadı.";
    }

  }, 8000);

}

// Sayılar değişince eski sonucu temizle.
function sonucuTemizle() {
  istekNo++;
  cevapGeldi = true;
  clearTimeout(zamanAsimi);

  const eskiScript =
    document.getElementById("jsonpScript");

  if (eskiScript) eskiScript.remove();

  sonuc.innerText = "—";
  durum.innerText = "";
}

sayi1.addEventListener("input", sonucuTemizle);
sayi2.addEventListener("input", sonucuTemizle);

// Enter ile hesaplama
[sayi1, sayi2].forEach(function(input) {

  input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      event.preventDefault();
      hesapla();
    }

  });

});

// PWA SERVICE WORKER
if ("serviceWorker" in navigator) {

  window.addEventListener("load", function() {

    navigator.serviceWorker
      .register("./service-worker.js")
      .catch(function(error) {
        console.log("Service Worker error:", error);
      });

  });

}

</script>

</body>
</html>
