<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <link
    rel="manifest"
    href="manifest.json">

  <title>Çarpma</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;

      background: #f2f2f7;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      max-width: 420px;

      background: white;

      padding: 25px;

      border-radius: 20px;

      box-shadow:
        0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    input {
      width: 100%;

      font-size: 24px;

      padding: 15px;

      margin-top: 12px;

      border-radius: 12px;

      border: 1px solid #ccc;
    }

    button {
      width: 100%;

      margin-top: 20px;

      padding: 15px;

      font-size: 22px;
      font-weight: 600;

      border: none;

      border-radius: 12px;

      background: #007aff;
      color: white;
    }

    #sonuc {
      margin-top: 25px;

      padding: 18px;

      background: #f2f2f7;

      border-radius: 12px;

      font-size: 32px;
      font-weight: bold;

      text-align: center;
    }

    #durum {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }

  </style>
</head>

<body>

<div class="card">

  <h1>Çarpma</h1>

  <input
    id="sayi1"
    type="number"
    inputmode="decimal"
    placeholder="Birinci sayı">

  <input
    id="sayi2"
    type="number"
    inputmode="decimal"
    placeholder="İkinci sayı">

  <button onclick="hesapla()">
    Çarp
  </button>

  <div id="sonuc">
    —
  </div>

  <div id="durum"></div>

</div>


<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxRo0pdcBzjlfCwX_WtJiqZFHJI-dmH0jNjXxGfymtyS-Kq7SPMVHLuJZqpOWjY-yN-mg/exec";


function hesapla() {

  const a =
    document
      .getElementById("sayi1")
      .value;

  const b =
    document
      .getElementById("sayi2")
      .value;


  document
    .getElementById("durum")
    .innerText =
    "Hesaplanıyor...";


  const eskiScript =
    document.getElementById("jsonpScript");

  if (eskiScript) {
    eskiScript.remove();
  }


  const script =
    document.createElement("script");

  script.id =
    "jsonpScript";


  script.src =
    APPS_SCRIPT_URL +
    "?a=" +
    encodeURIComponent(a) +
    "&b=" +
    encodeURIComponent(b) +
    "&callback=sonucuGoster";


  script.onerror =
    function() {

      document
        .getElementById("durum")
        .innerText =
        "Apps Script bağlantı hatası.";

    };


  document.body.appendChild(script);

}


function sonucuGoster(data) {

  if (data.success) {

    document
      .getElementById("sonuc")
      .innerText =
      data.result;

    document
      .getElementById("durum")
      .innerText =
      "";

  } else {

    document
      .getElementById("durum")
      .innerText =
      "Hata oluştu.";

  }

}


document
  .getElementById("sayi2")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        hesapla();
      }

    }
  );

</script>


<script>

if ("serviceWorker" in navigator) {

  navigator
    .serviceWorker
    .register("./service-worker.js")
    .catch(function(error) {

      console.log(
        "Service Worker error:",
        error
      );

    });

}

</script>

</body>

</html>
